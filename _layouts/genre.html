---
layout: default
---
<section class="genre-page-hero {{ page.theme }}">
  <div class="wrap">
    <h1>{{ page.title }}</h1>
    <p>{{ page.intro }}</p>
    <a class="button button-accent" href="{{ '/#tickets' | relative_url }}">Get ticket news <span>↗</span></a>
  </div>
</section>
<section class="genre-page-body section wrap">
  <div>
    <h2>{{ page.headline }}</h2>
  </div>
  <div class="genre-page-copy">
    <p>{{ page.body }}</p>
    <a class="arrow-link" href="{{ '/' | relative_url }}#genres">Explore every way to play <span>→</span></a>
  </div>
</section>
