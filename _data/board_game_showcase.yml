- name: "Bandwagon"
  designers: "Tom James & Stephen McCowage"
  description: "Can you predict and join the next big music trend? Observe what music is hot by looking at the back of players cards and band together to make your preferred music genre win!"
  image: "/assets/images/board-games/bandwagon-thumb.webp"
  large_image: "/assets/images/board-games/bandwagon-large.webp"
- name: "Battle For Dominance: Reign of the Olympian Gods"
  designers: "Tom Mutch"
  description: "Play as an all-powerful Greek god and be the first to complete your unique objective, while preventing others from achieving theirs. Every god has their own cards, tiles and strategies. Explore a new map every game. No two games are ever the same."
  image: "/assets/images/board-games/battle-for-dominance-reign-of-the-olympian-gods-thumb-v2.webp"
  large_image: "/assets/images/board-games/battle-for-dominance-reign-of-the-olympian-gods-large-v2.webp"
- name: "Colour Crazy"
  designers: "Kem Pobjie"
  description: "Colour Crazy is a mind-bending game of brilliant colours. Race against your opponents to connect colours and claim victory. Colour Crazy will twist your mind, test your reflexes and leave you craving for just one more game."
  image: "/assets/images/board-games/colour-crazy-thumb.webp"
  large_image: "/assets/images/board-games/colour-crazy-large.webp"
- name: "Cooks N Crooks"
  designers: "Zac Hardman"
  description: "Race player to make sandwiches, send crooks to defeat your rivals and make the legendary fairy bread combination to instantly win."
  image: "/assets/images/board-games/cooks-n-crooks-thumb.webp"
  large_image: "/assets/images/board-games/cooks-n-crooks-large.webp"
- name: "Indoctrinated!"
  designers: "Benny Keatinge"
  description: "In 'Indoctrinated!' you must abide by the 'Doctrine' and kill your friend! Play cards as Actions or Tricks, and steal your opponent's blood, known in the World of Wander as PERFLO. The magic and mechanics of Indoctrinated are directly inspired by the Game Designer's original novel 'Wander - Through Shadow and Flesh'."
  image: "/assets/images/board-games/indoctrinated-thumb.webp"
  large_image: "/assets/images/board-games/indoctrinated-large.webp"
- name: "JunkYard"
  designers: "Stephen McCowage & Tom James"
  description: "In a chaotic junkyard where nothing goes to waste, you and your fellow inventors push your luck scavenging through a dangerous junkpile looking for the right parts you need to build outrageous inventions!"
  image: "/assets/images/board-games/junkyard-thumb.webp"
  large_image: "/assets/images/board-games/junkyard-large.webp"
- name: "Odyssey, the Epic of Penelope and Odysseus"
  designers: "Ben Galea"
  description: "In Odyssey, the Epic of Penelope and Odysseus, you and a friend will play through the story of the Odyssey from the perspectives of Penelope and Odysseus using a rummy style set collecting game as the core gameplay loop"
  image: "/assets/images/board-games/odyssey-the-epic-of-penelope-and-odysseus-thumb.webp"
  large_image: "/assets/images/board-games/odyssey-the-epic-of-penelope-and-odysseus-large.webp"
- name: "Pirates of the Dead Isles"
  designers: "Zac Hardman"
  description: "Sail your pirate ship across 4 seas to plunder loot, battle enemy ships, betray your friends and dodge the mighty kraken."
  image: "/assets/images/board-games/pirates-of-the-dead-isles-thumb-v2.webp"
  large_image: "/assets/images/board-games/pirates-of-the-dead-isles-large-v2.webp"
- name: "Season Stories"
  designers: "Kem Pobjie"
  description: "Season Stories is a strategic card game where players take on the role of competing seasons, each vying for control of five locations. While each competing for dominance, every player’s actions influence those around them, with shared weather attributes creating moments of alignment, conflict and shifting, unspoken alliances."
  image: "/assets/images/board-games/season-stories-thumb.webp"
  large_image: "/assets/images/board-games/season-stories-large.webp"
- name: "Shelf Control"
  designers: "Samantha Zeng"
  description: "Make your library the most popular library in town, by buying books, attracting bookworms, and giving your books to bookworms to devour."
  image: "/assets/images/board-games/shelf-control-thumb.webp"
  large_image: "/assets/images/board-games/shelf-control-large.webp"
- name: "Snackbots"
  designers: "Duncan Latto, Fillip Lovely"
  description: "Snackbots is a fast paced simultaneous play game were you have to compete to complete recipes in real time. \nIn the not so far future every worker now works 24hrs a day in real fake jobs, it is your job as a Snackbot to make sure these workers get fed!"
  image: "/assets/images/board-games/snackbots-thumb.webp"
  large_image: "/assets/images/board-games/snackbots-large.webp"
- name: "Spy School"
  designers: "Duncan Latto"
  description: "Work with your fellow spy classmates in cooperative missions but be careful not to expose too much about your personal information. If your cover is blown you might be killed or worse, expelled!"
- name: "Subtopia"
  designers: "Carlos Lam"
  description: "Can you bring the homeowner's dream of suburban paradise?\n\nFor 2 - 4 players, play as tycoon developers that earn money developing over rural land. Players gentrify by flipping over double sided tiles from intriguing rural scenes to cookie cutter suburbia. As property tycoons, you may look to buy the suburbs in a hostile takeover. Strategically buy out the board and compete with other players in a corporate land grab, negotiate in property deals, and then throw down your corporate malls to grow your company!\n\nTry to build the impossible suburban paradise and compete in this tile placement, map expansion, area control game. Become the richest and live the dream by building your corporate empire. Home ownership and individual success are widespread beliefs in living the dream. Then ask yourself, in our interconnected world for the majority of humans, what really makes the dream work?"
  image: "/assets/images/board-games/subtopia-thumb.webp"
  large_image: "/assets/images/board-games/subtopia-large.webp"
- name: "Summon Arena"
  designers: "Hayden Webber"
  description: "Summon Arena is a turn based, easy-to-learn TCG with no card text, or hit counters. It’s built around simple movement mechanics and fully customisable deck building that creates a high ceiling for strategy."
  image: "/assets/images/board-games/summon-arena-thumb.webp"
  large_image: "/assets/images/board-games/summon-arena-large.webp"
- name: "That Brick Game"
  designers: "Stephen McCowage"
  description: "That Brick Game is a fast, physical stacking game where the dice calls the shots and you do the heavy lifting. Stack bricks, avoid hazards, and sabotage other Builders to make sure you're left with the smallest pile of rubble when the final brick is laid."
  image: "/assets/images/board-games/that-brick-game-thumb.webp"
  large_image: "/assets/images/board-games/that-brick-game-large.webp"
- name: "The Enchanted Library"
  designers: "Zac Hardman"
  description: "In the Enchanted Library, players use enchantments, cunning, and careful positioning to return books to their shelves. Strategically place books on your trolley and score points each time you match books to a pattern. This is an abstract strategy game that suits 2-4 players and takes 40-70 minutes."
  image: "/assets/images/board-games/the-enchanted-library-thumb.webp"
  large_image: "/assets/images/board-games/the-enchanted-library-large.webp"
- name: "Troupe"
  designers: "Stuart R Southwell"
  description: "Welcome! Out of desperation the king has called upon you - the street charlatans - to put on a series of performances to captivate the city of Dumdon - the show must go on!"
  image: "/assets/images/board-games/troupe-thumb.webp"
  large_image: "/assets/images/board-games/troupe-large.webp"
